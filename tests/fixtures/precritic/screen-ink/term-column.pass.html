<!doctype html><html><head><meta charset="utf-8"><title>screen-ink fixture</title>
<style>body{margin:0;font-family:sans-serif;background:#fff} .ws-cell,.mq-scell{box-sizing:border-box;border:1px solid #000;padding:4mm;margin:4mm}
.row{display:flex;gap:6mm;align-items:flex-start} .fact{font-size:40px;width:40mm} .term{display:flex;flex-direction:column;align-items:center;gap:2mm}</style></head><body>
<!-- queue 15 (lead): growing-pattern terms are one-dot-wide columns of 2 / 3 / 4 rings, taller than wide BY THE MATHS; the old SIZE-WIDTH failed each (about 2 % of the free width). Judged by the unit: screen ring 2.6 mm against print 2.2 mm: OK -->
<div data-mq-print><div class="ws-cell" data-ws-cell style="width:120mm"><div class="row"><div class="term"><div style="font-size:15px;font-weight:700">Term 1</div><svg aria-label="Term 1: 2 dots" viewBox="0 0 3.2 6.4" style="width:3.2mm;height:6.4mm;display:block"><circle cx="1.6" cy="1.6" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="4.800000000000001" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/></svg></div><div class="term"><div style="font-size:15px;font-weight:700">Term 2</div><svg aria-label="Term 2: 3 dots" viewBox="0 0 3.2 9.600000000000001" style="width:3.2mm;height:9.600000000000001mm;display:block"><circle cx="1.6" cy="1.6" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="4.800000000000001" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="8.0" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/></svg></div><div class="term"><div style="font-size:15px;font-weight:700">Term 3</div><svg aria-label="Term 3: 4 dots" viewBox="0 0 3.2 12.8" style="width:3.2mm;height:12.8mm;display:block"><circle cx="1.6" cy="1.6" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="4.800000000000001" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="8.0" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.6" cy="11.200000000000001" r="1.1" fill="none" stroke="#000" stroke-width="0.35"/></svg></div></div></div></div>
<div data-mq-screen><div class="mq-scell" style="width:190mm"><div class="row"><div class="term"><div style="font-size:15px;font-weight:700">Term 1</div><svg aria-label="Term 1: 2 dots" viewBox="0 0 3.6 7.2" style="width:3.6mm;height:7.2mm;display:block"><circle cx="1.8" cy="1.8" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="5.4" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/></svg></div><div class="term"><div style="font-size:15px;font-weight:700">Term 2</div><svg aria-label="Term 2: 3 dots" viewBox="0 0 3.6 10.8" style="width:3.6mm;height:10.8mm;display:block"><circle cx="1.8" cy="1.8" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="5.4" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="9.0" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/></svg></div><div class="term"><div style="font-size:15px;font-weight:700">Term 3</div><svg aria-label="Term 3: 4 dots" viewBox="0 0 3.6 14.4" style="width:3.6mm;height:14.4mm;display:block"><circle cx="1.8" cy="1.8" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="5.4" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="9.0" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/><circle cx="1.8" cy="12.600000000000001" r="1.3" fill="none" stroke="#000" stroke-width="0.35"/></svg></div></div></div></div>
</body></html>
