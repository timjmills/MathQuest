<!doctype html><html><head><meta charset="utf-8"><title>screen-ink fixture</title>
<style>body{margin:0;font-family:sans-serif;background:#fff} .ws-cell,.mq-scell{box-sizing:border-box;border:1px solid #000;padding:4mm;margin:4mm}
.row{display:flex;gap:6mm;align-items:flex-start} .fact{font-size:40px;width:40mm}</style></head><body>
<!-- SIZE-INK fail (lf-ops halo addition): touch dots whose INK is 1.6 mm on screen against 2.0 mm on paper (80 %), each on a white halo circle; the halos are not marks, so the small ink still FAILS -->
<div data-mq-print><div class="ws-cell" data-ws-cell style="width:80mm"><div class="row"><span class="fact">4 + 1 =</span><svg class="ws-td-svg ws-tn-svg" data-digit="4" aria-label="4, 4 touch dots" viewBox="0 0 12 12" style="width:12mm;height:12mm;display:block"><path d="M1 1 L11 1 L11 11 L1 11 Z" fill="#000" opacity="0.15"/><g class="ws-td-mark"><circle cx="3" cy="3" r="1.4" fill="#fff"/><circle cx="3" cy="3" r="1.0" fill="#000"/></g><g class="ws-td-mark"><circle cx="9" cy="3" r="1.4" fill="#fff"/><circle cx="9" cy="3" r="1.0" fill="#000"/></g><g class="ws-td-mark"><circle cx="3" cy="9" r="1.4" fill="#fff"/><circle cx="3" cy="9" r="1.0" fill="#000"/></g><g class="ws-td-mark"><circle cx="9" cy="9" r="1.4" fill="#fff"/><circle cx="9" cy="9" r="1.0" fill="#000"/></g></svg></div></div></div>
<div data-mq-screen><div class="mq-scell" style="width:80mm"><div class="row"><span class="fact">4 + 1 =</span><svg class="ws-td-svg ws-tn-svg" data-digit="4" aria-label="4, 4 touch dots" viewBox="0 0 12 12" style="width:12mm;height:12mm;display:block"><path d="M1 1 L11 1 L11 11 L1 11 Z" fill="#000" opacity="0.15"/><g class="ws-td-mark"><circle cx="3" cy="3" r="0.93" fill="#fff"/><circle cx="3" cy="3" r="0.8" fill="#000"/></g><g class="ws-td-mark"><circle cx="9" cy="3" r="0.93" fill="#fff"/><circle cx="9" cy="3" r="0.8" fill="#000"/></g><g class="ws-td-mark"><circle cx="3" cy="9" r="0.93" fill="#fff"/><circle cx="3" cy="9" r="0.8" fill="#000"/></g><g class="ws-td-mark"><circle cx="9" cy="9" r="0.93" fill="#fff"/><circle cx="9" cy="9" r="0.8" fill="#000"/></g></svg></div></div></div>
</body></html>
