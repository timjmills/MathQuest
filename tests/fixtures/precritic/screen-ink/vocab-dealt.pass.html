<!doctype html><html><head><meta charset="utf-8"><title>screen-ink fixture</title>
<style>body{margin:0;font-family:sans-serif;background:#fff} .ws-cell,.mq-scell{box-sizing:border-box;border:1px solid #000;padding:4mm;margin:4mm}
.row{display:flex;gap:6mm;align-items:flex-start} .fact{font-size:40px;width:40mm} .term{display:flex;flex-direction:column;align-items:center;gap:2mm}</style></head><body>
<!-- queue 14 (lf-vocab): the Independent page never deals this word (only a 12-dot array), so the old tool read SIZE-REF; the print cell of the item the worksheet DEALT ([data-mq-print-dealt], w1) holds it at 5 mm and the screen draws 6 mm: OK -->
<div data-mq-print><div class="ws-cell" data-ws-cell style="width:80mm"><div class="row"><span class="fact">12 ÷ 4 =</span><svg aria-label="array, 3 rows of 4" viewBox="0 0 40 30" style="width:16mm;height:12mm;display:block"><circle cx="5" cy="5" r="2.5"/><circle cx="15" cy="5" r="2.5"/><circle cx="25" cy="5" r="2.5"/><circle cx="35" cy="5" r="2.5"/><circle cx="5" cy="15" r="2.5"/><circle cx="15" cy="15" r="2.5"/><circle cx="25" cy="15" r="2.5"/><circle cx="35" cy="15" r="2.5"/><circle cx="5" cy="25" r="2.5"/><circle cx="15" cy="25" r="2.5"/><circle cx="25" cy="25" r="2.5"/><circle cx="35" cy="25" r="2.5"/></svg></div></div></div>
<div data-mq-print-dealt><div data-mq-dealt="w1"><div class="ws-cell" data-ws-cell style="width:80mm"><div class="row"><span class="fact" style="font-size:16px">triangle</span><svg aria-label="picture" viewBox="0 0 25 5" style="width:25mm;height:5mm;display:block"><polygon points="0,5 2.5,0 5,5"/><polygon points="10,5 12.5,0 15,5"/><polygon points="20,5 22.5,0 25,5"/></svg></div></div></div></div>
<div data-mq-screen><div class="mq-scell" data-mq-dealt="w1" style="width:190mm"><div class="row"><span class="fact" style="font-size:16px">triangle</span><svg aria-label="picture" viewBox="0 0 30 6" style="width:30mm;height:6mm;display:block"><polygon points="0,6 3.0,0 6,6"/><polygon points="12,6 15.0,0 18,6"/><polygon points="24,6 27.0,0 30,6"/></svg></div></div></div>
</body></html>
