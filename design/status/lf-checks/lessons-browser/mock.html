<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lessons Browser Mock</title>
<!-- The app's real teacher CSS (tokens, Skills screen, Lessons screen). The mock-only rules below are marked PROPOSED. -->
<link rel="stylesheet" href="../../../../css/teacher-tokens.css">
<link rel="stylesheet" href="../../../../css/teacher-library.css">
<link rel="stylesheet" href="../../../../css/teacher-wrm.css">
<style>
:root{--ink:#111;--line:#c9c9c9;--soft:#f3f3f3;--muted:#555;--bg:#fff;--act:#1f4e8c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#111;--bg:#fff}}
:root[data-theme="dark"]{--ink:#111;--bg:#fff}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Andika","Segoe UI",system-ui,sans-serif}
#teacherApp{display:block;min-height:100vh}
.mk-top{display:flex;align-items:center;gap:16px;padding:14px 24px 6px}
.mk-top h1{margin:0;font-size:26px}
.mk-note{font-size:12px;color:var(--muted);margin-left:auto;max-width:430px;text-align:right}
.mk-bar{margin:6px 24px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:6px}
.mk-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mk-lab{font-weight:700;font-size:13px;width:86px;color:var(--muted)}
.mk-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font:600 13px/20px inherit;font-family:inherit;color:var(--ink)}
.mk-pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.mk-pill .n{font-weight:400;opacity:.75;margin-left:4px}
.mk-sep{width:1px;height:22px;background:var(--line);margin:0 8px}
.mk-tog{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font:700 13px/20px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.mk-tog .sw{width:30px;height:18px;border-radius:9px;background:#ddd;position:relative}
.mk-tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #999}
.mk-tog[aria-pressed="true"] .sw{background:var(--ink)}
.mk-tog[aria-pressed="true"] .sw::after{left:14px}
.mk-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mk-seg button{border:0;background:#fff;padding:3px 12px;font:600 13px/20px inherit;font-family:inherit;color:var(--ink)}
.mk-seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mk-sum{margin:8px 24px 0;font-size:14px}
.mk-sum b{font-size:15px}
.mk-main{padding:4px 24px 40px}
.mk-dh{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);margin:16px 0 6px;padding-bottom:2px}
.mk-dh h2{margin:0;font-size:18px}.mk-dh span{font-size:13px;color:var(--muted)}
.mk-list{list-style:none;margin:0;padding:0}
.mk-r{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #e4e4e4;padding:6px 30px 6px 4px;position:relative}
.mk-r .num{color:var(--muted);font-size:13px;text-align:right}
.mk-chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);border-radius:6px;padding:0 7px;font:600 12px/20px inherit;font-family:inherit;white-space:nowrap;background:#fff}
.chip.full{border-color:var(--ink)}
.chip.part{border-style:dashed}
.chip.pass{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.build{border-color:#888;color:#444;background:repeating-linear-gradient(135deg,#fff 0 4px,#f0f0f0 4px 8px)}
/* the Skills screen's own corner mark (.ts-pass in teacher-library.css), reused as is */
.mk-corner{position:absolute;right:0;bottom:0;width:22px;height:22px;overflow:hidden}
.mk-corner::before{content:"";position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 22px 22px;border-color:transparent transparent var(--act) transparent}
.mk-corner::after{content:"✓";position:absolute;right:2px;bottom:0;color:#fff;font:700 10px/1.2 sans-serif}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.mk-card{border:1px solid var(--line);border-radius:10px;padding:8px;position:relative;background:#fff}
.mk-card .t{font-weight:700;font-size:13px;line-height:1.25;min-height:32px}
.mk-card .meta{display:flex;gap:6px;align-items:center;margin-top:6px}
.gb{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ink);font:700 12px/1 inherit;font-family:inherit;padding:0 4px}
.thumb{height:118px;border:1px solid #ddd;border-radius:4px;margin-bottom:6px;padding:6px;background:#fff;display:grid;grid-template-rows:auto auto 1fr;gap:4px;overflow:hidden}
.thumb .hb{height:10px;border-bottom:1.5px solid #222;display:flex;justify-content:space-between;font-size:6px}
.thumb .ic{font-size:8px;font-weight:700}
.thumb .cells{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.thumb .cells i{border:1px solid #333;border-radius:2px;min-height:18px;display:grid;place-items:center;font:700 9px/1 inherit;font-style:normal}
.mk-back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:8px;padding:4px 12px;background:#fff;font:700 14px/20px inherit;font-family:inherit;margin:10px 24px 0}
.mk-hcard{margin:10px 24px;border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;position:relative}
.mk-hcard h2{margin:0 0 4px;font-size:22px}
.mk-hcard .mk-corner{width:34px;height:34px}.mk-hcard .mk-corner::before{border-width:0 0 34px 34px}.mk-hcard .mk-corner::after{font-size:14px;right:3px}
.mk-pages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 24px}
.mk-pages .thumb{height:200px}
.mk-sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mk-sk .mk-card .t{min-height:0}
.legend{font-size:12px;color:var(--muted);margin:4px 24px 0}
</style></head>
