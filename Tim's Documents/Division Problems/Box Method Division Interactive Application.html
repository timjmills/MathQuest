<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Method Interactive</title>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Inline SVG Icons to avoid external library dependency issues
    const PlayIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
    );

    const RotateCcwIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <polyline points="3 3 3 8 8 8"></polyline>
      </svg>
    );

    const ArrowRightIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="text-amber-500 w-8 h-8">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    );

    const ChevronLeftIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    );

    const ChevronRightIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    );

    function App() {
      const [dividendInput, setDividendInput] = useState('435');
      const [divisorInput, setDivisorInput] = useState('3');
      const [dividend, setDividend] = useState('435');
      const [divisor, setDivisor] = useState(3);
      const [currentStepIndex, setCurrentStepIndex] = useState(0);

      // Validate and generate new problem
      const handleGenerate = () => {
        const newDiv = parseInt(dividendInput);
        const newDivis = parseInt(divisorInput);
        if (!isNaN(newDiv) && !isNaN(newDivis) && newDivis > 0 && newDiv >= 0) {
          setDividend(newDiv.toString());
          setDivisor(newDivis);
          setCurrentStepIndex(0);
        }
      };

      // Generate the sequence of steps for the animation
      const steps = useMemo(() => {
        const s = [];
        s.push({
          type: 'setup',
          box: -1,
          msg: 'Step 1: Set up the boxes. Place the divisor on the outside and the dividend digits inside.',
        });

        let currentRem = 0;
        const digits = dividend.split('');

        for (let i = 0; i < digits.length; i++) {
          const digit = parseInt(digits[i]);
          const val = currentRem * 10 + digit;
          const q = Math.floor(val / divisor);
          const sub = q * divisor;
          const newRem = val - sub;

          // Step A: Divide
          s.push({
            type: 'divide',
            box: i,
            val,
            q,
            msg: `Divide: How many times does ${divisor} go into ${val}? It goes in ${q} times. Write ${q} on the roof.`,
          });

          // Step B: Multiply & Subtract
          s.push({
            type: 'subtract',
            box: i,
            val,
            q,
            sub,
            rem: newRem,
            msg: `Multiply & Subtract: ${q} × ${divisor} = ${sub}. Subtract ${sub} from ${val} to get a remainder of ${newRem}.`,
          });

          // Step C: Move Remainder (if not the last box)
          if (i < digits.length - 1) {
            const nextDigit = parseInt(digits[i + 1]);
            s.push({
              type: 'move',
              box: i,
              rem: newRem,
              nextDigit,
              nextVal: newRem * 10 + nextDigit,
              msg: `Move Remainder: Draw an arrow and carry the remainder (${newRem}) to the next box to make ${newRem * 10 + nextDigit}.`,
            });
          }
          currentRem = newRem;
        }

        const finalQuotient = Math.floor(parseInt(dividend) / divisor);
        s.push({
          type: 'finish',
          box: -1,
          msg: `Finished! The final answer is ${finalQuotient}${currentRem > 0 ? ` with a remainder of ${currentRem}` : ''}.`,
        });

        return s;
      }, [dividend, divisor]);

      // Derived state for rendering the boxes at the current step
      const boxStates = useMemo(() => {
        const states = dividend.split('').map((d) => ({
          originalDigit: d,
          displayValue: d,
          roof: null,
          subtraction: null,
          remainder: null,
          isMovingOut: false,
        }));

        for (let i = 0; i <= currentStepIndex; i++) {
          const step = steps[i];
          if (step.box >= 0 && step.box < states.length) {
            if (step.type === 'divide') {
              states[step.box].displayValue = step.val.toString();
              states[step.box].roof = step.q;
            } else if (step.type === 'subtract') {
              states[step.box].subtraction = step.sub;
              states[step.box].remainder = step.rem;
            } else if (step.type === 'move') {
              states[step.box].isMovingOut = true;
              if (step.box + 1 < states.length) {
                states[step.box + 1].displayValue = `${step.rem}${states[step.box + 1].originalDigit}`;
              }
            }
          }
        }
        return states;
      }, [dividend, steps, currentStepIndex]);

      const currentStep = steps[currentStepIndex];

      // Keyboard navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight') {
            setCurrentStepIndex((prev) => Math.min(prev + 1, steps.length - 1));
          } else if (e.key === 'ArrowLeft') {
            setCurrentStepIndex((prev) => Math.max(prev - 1, 0));
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [steps.length]);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800 p-6">
          <div className="max-w-4xl mx-auto w-full bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
            
            {/* Header & Controls */}
            <div className="bg-blue-700 text-white p-6 border-b-4 border-blue-900">
              <h1 className="text-2xl font-bold uppercase tracking-wider mb-2 flex items-center gap-2">
                <PlayIcon />
                Interactive Box Method
              </h1>
              <p className="text-blue-100 text-sm mb-4">
                Follow the "Silent Teacher" routine step-by-step. Use arrow keys to navigate.
              </p>
              
              <div className="flex flex-wrap items-end gap-4 bg-blue-800/50 p-4 rounded-lg">
                <div>
                  <label className="block text-xs font-bold text-blue-200 uppercase mb-1">Dividend (Inside)</label>
                  <input 
                    type="number" 
                    value={dividendInput}
                    onChange={(e) => setDividendInput(e.target.value.slice(0, 4))}
                    className="w-24 px-3 py-2 rounded text-slate-900 font-mono text-lg font-bold outline-none focus:ring-2 focus:ring-amber-400"
                    max="9999"
                  />
                </div>
                <div className="text-2xl font-bold pb-2">÷</div>
                <div>
                  <label className="block text-xs font-bold text-blue-200 uppercase mb-1">Divisor (Outside)</label>
                  <input 
                    type="number" 
                    value={divisorInput}
                    onChange={(e) => setDivisorInput(e.target.value.slice(0, 2))}
                    className="w-16 px-3 py-2 rounded text-slate-900 font-mono text-lg font-bold outline-none focus:ring-2 focus:ring-amber-400"
                    max="99"
                  />
                </div>
                <button 
                  onClick={handleGenerate}
                  className="bg-amber-500 hover:bg-amber-400 text-amber-950 font-bold px-5 py-2 rounded shadow transition-colors ml-auto md:ml-4 flex items-center gap-2"
                >
                  <RotateCcwIcon /> Reset Boxes
                </button>
              </div>
            </div>

            {/* Expert Narration Callout */}
            <div className="p-6 pb-2">
              <div className="bg-blue-50 border-l-4 border-blue-600 rounded-r-lg p-5 shadow-sm">
                <h3 className="text-blue-800 font-bold text-sm uppercase tracking-wider mb-1 flex items-center gap-2">
                  <span>👨‍🏫 Expert Narration</span>
                  <span className="bg-blue-200 text-blue-800 px-2 py-0.5 rounded-full text-xs">
                    Step {currentStepIndex + 1} of {steps.length}
                  </span>
                </h3>
                <p className="text-lg text-slate-700 font-medium">
                  {currentStep.msg}
                </p>
              </div>
            </div>

            {/* Visual Model Canvas */}
            <div className="p-8 pb-16 flex justify-center items-center overflow-x-auto min-h-[350px]">
              <div className="flex items-start mt-8 relative">
                
                {/* Divisor Outside */}
                <div className="flex flex-col items-center justify-center pt-8 pr-4">
                  <div className="text-3xl font-mono font-bold text-slate-700">{divisor}</div>
                </div>

                {/* Boxes */}
                <div className="flex">
                  {boxStates.map((box, i) => {
                    const isActive = currentStep.box === i;
                    const isDivide = currentStep.type === 'divide' && isActive;
                    const isSubtract = currentStep.type === 'subtract' && isActive;
                    const isMove = currentStep.type === 'move' && isActive;

                    return (
                      <div key={i} className="relative flex flex-col items-center">
                        
                        {/* Roof (Quotient) */}
                        <div className={`h-12 flex items-end justify-center w-full pb-2 text-3xl font-mono font-bold transition-all duration-300 ${
                          box.roof !== null ? 'text-green-700 opacity-100 transform translate-y-0' : 'opacity-0 transform translate-y-2'
                        } ${isDivide ? 'scale-110 text-amber-600' : ''}`}>
                          {box.roof !== null ? box.roof : ''}
                        </div>

                        {/* Main Box */}
                        <div className={`
                          w-28 border-t-4 border-r-4 border-b-4 border-slate-800 p-4 min-h-[160px] flex flex-col items-end
                          transition-colors duration-300
                          ${i === 0 ? 'border-l-4' : ''}
                          ${isActive ? 'bg-blue-50' : 'bg-white'}
                        `}>
                          
                          {/* Current Value */}
                          <div className={`text-3xl font-mono font-bold w-full text-right ${boxStates[i].displayValue.length > 1 && i > 0 && currentStepIndex >= steps.findIndex(s => s.type === 'move' && s.box === i-1) ? 'text-amber-600' : 'text-slate-800'}`}>
                            {box.displayValue}
                          </div>

                          {/* Subtraction Row */}
                          {box.subtraction !== null && (
                            <div className={`w-full flex justify-between items-center text-2xl font-mono text-slate-600 mt-2 border-b-2 border-slate-400 pb-1 ${isSubtract ? 'animate-pulse' : ''}`}>
                              <span>-</span>
                              <span>{box.subtraction}</span>
                            </div>
                          )}

                          {/* Remainder */}
                          {box.remainder !== null && (
                            <div className={`text-2xl font-mono font-bold w-full text-right mt-2 ${box.isMovingOut ? 'text-amber-500' : 'text-red-600'}`}>
                              {box.remainder}
                            </div>
                          )}

                        </div>

                        {/* Move Remainder Arrow */}
                        {box.isMovingOut && currentStepIndex >= steps.findIndex(s => s.type === 'move' && s.box === i) && (
                          <div className={`absolute -right-4 top-1/2 transform -translate-y-1/2 z-10 flex flex-col items-center ${isMove ? 'animate-bounce' : ''}`}>
                             <ArrowRightIcon />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

              </div>
            </div>

            {/* Step Navigation */}
            <div className="bg-slate-100 p-4 border-t border-slate-200 flex justify-between items-center">
              <button 
                onClick={() => setCurrentStepIndex(Math.max(0, currentStepIndex - 1))}
                disabled={currentStepIndex === 0}
                className="px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 hover:text-blue-600"
              >
                <ChevronLeftIcon /> Previous
              </button>
              
              <div className="flex gap-1.5">
                {steps.map((_, i) => (
                  <div 
                    key={i} 
                    className={`h-2 rounded-full transition-all duration-300 ${
                      i === currentStepIndex 
                        ? 'w-6 bg-blue-600' 
                        : i < currentStepIndex ? 'w-2 bg-blue-400' : 'w-2 bg-slate-300'
                    }`} 
                  />
                ))}
              </div>

              <button 
                onClick={() => setCurrentStepIndex(Math.min(steps.length - 1, currentStepIndex + 1))}
                disabled={currentStepIndex === steps.length - 1}
                className="px-4 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed bg-blue-600 text-white hover:bg-blue-700 shadow-sm"
              >
                Next Step <ChevronRightIcon />
              </button>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
